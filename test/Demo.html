<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Audio Visualizer</title>
    <style>
        body { margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; color: white; font-family: sans-serif; }
        canvas { width: 100%; height: 300px; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #00ffcc; border: none; border-radius: 5px; font-weight: bold; }
        p { margin-top: 10px; color: #888; }
    </style>
</head>
<body>

    <canvas id="visualizer"></canvas>
    <button id="startBtn">マイク入力を開始</button>
    <p>（マイクに向かって音を出してみてください）</p>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');

        let audioCtx;
        let analyser;
        let dataArray;

        startBtn.addEventListener('click', async () => {
            // ブラウザの制限解除（クリック後にオーディオ開始）
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                
                try {
                    // マイク音声の取得
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const source = audioCtx.createMediaStreamSource(stream);
                    source.connect(analyser);

                    // 解析の細かさ
                    analyser.fftSize = 128; 
                    const bufferLength = analyser.frequencyBinCount;
                    dataArray = new Uint8Array(bufferLength);

                    startBtn.style.display = 'none';
                    draw();
                } catch (err) {
                    alert("マイクの使用を許可してください。");
                }
            }
        });

        function draw() {
            requestAnimationFrame(draw);

            // 周波数データを取得
            analyser.getByteFrequencyData(dataArray);

            // 画面をリセット
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / dataArray.length) * 2;
            let x = 0;

            for (let i = 0; i < dataArray.length; i++) {
                const barHeight = dataArray[i] * 1.2; // 伸びる高さの倍率

                // 色の設定（虹色っぽく）
                ctx.fillStyle = `hsl(${i * 10}, 100%, 50%)`;
                
                // 中央から上下に伸びるように描画
                ctx.fillRect(x, (canvas.height - barHeight) / 2, barWidth - 2, barHeight);

                x += barWidth;
            }
        }
    </script>
</body>
</html>
